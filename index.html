<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07120d">
<meta name="description" content="MG Bhone Mann Chi — Personal Contact Card">
<title>Welcome | MG Bhone Mann Chi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#7cff9b;--green2:#23d96b;--bg:#06100b;--muted:#a9c1b0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#f3fff6;background:radial-gradient(ellipse at 15% 10%,#123d25 0,transparent 35%),radial-gradient(ellipse at 90% 80%,#103c2b 0,transparent 38%),#06100b;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:240px;height:240px;border-radius:50%;filter:blur(75px);opacity:.22;pointer-events:none;animation:float 8s ease-in-out infinite alternate}
body:before{background:#32ff7e;top:4%;left:-70px}body:after{background:#00b86b;right:-80px;bottom:3%;animation-delay:-3s}
@keyframes float{to{transform:translate(30px,-25px) scale(1.12)}}
.card{position:relative;width:min(100%,430px);padding:30px 23px 24px;border:1px solid #baffca38;border-radius:30px;background:linear-gradient(145deg,#ffffff12,#ffffff05);box-shadow:0 25px 80px #0008,inset 0 1px #ffffff20;backdrop-filter:blur(22px);text-align:center}
.welcome{font-size:11px;letter-spacing:4px;color:var(--green);font-weight:800;margin-bottom:23px}
.avatar-wrap{width:116px;height:116px;padding:4px;margin:0 auto 17px;border-radius:50%;background:linear-gradient(135deg,#c6ffd5,var(--green2),#087a43);box-shadow:0 0 30px #43ff8740}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#13271b;border:3px solid #0b1b11}
h1{font-size:25px;line-height:1.2;margin:0 0 9px;font-weight:800;letter-spacing:-.7px}
.tag{font-size:13px;color:var(--muted);margin:0 0 22px}
.status{display:inline-flex;align-items:center;gap:7px;border:1px solid #7cff9b30;background:#7cff9b0c;color:#caffd5;border-radius:99px;padding:8px 12px;font-size:11px;margin-bottom:22px}
.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{min-height:51px;display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;color:#f2fff5;font-size:13px;font-weight:700;padding:12px 9px;border-radius:15px;border:1px solid #d5ffe11c;background:#ffffff0a;transition:.2s}
.link:hover{transform:translateY(-2px);background:#7cff9b16;border-color:#7cff9b70}
.link.primary{background:linear-gradient(120deg,#9affae,#36df76);color:#062411;border:0;box-shadow:0 8px 22px #25e86a20}
.icon{font-size:17px}
.full{grid-column:1/-1}
hr{border:0;border-top:1px solid #ffffff14;margin:23px 0 18px}
.qr-title{font-size:13px;font-weight:700;margin-bottom:7px}
.qr-help{font-size:11px;color:var(--muted);line-height:1.6;margin:0 auto 13px;max-width:280px}
.qr-box{display:none;width:160px;height:160px;padding:10px;margin:0 auto 12px;background:#fff;border-radius:13px}
.qr-box img{width:100%;height:100%}
.qr-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.small-btn{border:1px solid #7cff9b40;color:#d8ffe1;background:#7cff9b0b;border-radius:10px;padding:10px 12px;font:600 11px Inter, sans-serif;cursor:pointer}
footer{font-size:10px;color:#789482;margin-top:22px;letter-spacing:.5px}
.toast{font-size:11px;color:var(--green);min-height:16px;margin-top:8px}
@media(max-width:360px){.card{padding:25px 16px}h1{font-size:22px}.link{font-size:12px}}
</style>
</head>
